<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>사진첩 앵글 점검 · PRIVATE</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
:root{
  --forest:#123A2E;--navy:#0F3B3A;--leaf:#2E8A5A;--gold:#F2C230;
  --card:#FBF6E9;--line:rgba(20,48,61,.12);--ink:#1B2B24;
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:radial-gradient(120% 60% at 50% 0%,#FFFDF6 0%,#F5F1E2 46%,#EDE8D6 100%) fixed;
  color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 140px}
h1{margin:6px 0 2px;font-size:19px;font-weight:900;letter-spacing:-.035em;color:var(--forest)}
.lede{margin:0 0 14px;font-size:13px;color:rgba(20,48,61,.7);word-break:keep-all}
.lede b{color:var(--leaf)}
.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:0 0 14px}
button{font-family:inherit}
.btn{appearance:none;border:1px solid var(--line);border-radius:11px;padding:9px 13px;background:#fff;
  color:var(--forest);font-size:13px;font-weight:800;cursor:pointer;min-height:40px}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--leaf);border-color:transparent;color:#fff}
.btn.on{background:var(--forest);border-color:transparent;color:#FFF8E7}
.note{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.72);font-size:12.5px;color:rgba(20,48,61,.78);word-break:keep-all}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:14px}
.item{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:16px;padding:9px 9px 11px}
.item.dirty{border-color:var(--leaf);box-shadow:0 0 0 2px rgba(46,138,90,.18)}
/* 앱의 포토카드와 같은 비율·같은 자르기 방식 */
.shot{position:relative;width:100%;aspect-ratio:55/86;border-radius:11px;overflow:hidden;
  background:#1B4634;border:2.5px solid #FFFDF6;box-shadow:0 6px 16px rgba(15,59,58,.22)}
.shot img{display:block;width:100%;height:100%;object-fit:cover;background:#25543F}
.guide{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,80,80,.75);display:none}
body.guides .guide{display:block}
/* 원본 한 장 전체 위에, 카드가 실제로 보여줄 구간을 표시한다 */
.full{position:relative;width:100%;margin-top:8px;border-radius:9px;overflow:hidden;background:#0E2A1E;display:none}
body.showAll .full{display:block}
.full img{display:block;width:100%;height:auto}
.full .win{position:absolute;top:0;bottom:0;border:2px solid var(--gold);
  box-shadow:0 0 0 9999px rgba(8,23,44,.62);border-radius:3px}
.full .dim{position:absolute;left:0;bottom:0;padding:2px 5px;border-top-right-radius:6px;white-space:nowrap;
  background:rgba(8,23,44,.8);color:#FFF8E7;font-size:9px;font-weight:800;letter-spacing:0}
.who{margin:8px 2px 0;font-size:12.5px;font-weight:800;letter-spacing:-.03em;color:var(--forest);word-break:keep-all}
.who em{display:block;font-style:normal;font-size:10.5px;font-weight:600;color:rgba(20,48,61,.55);letter-spacing:.02em}
.val{display:flex;justify-content:space-between;align-items:center;margin:7px 2px 2px;font-size:11.5px;
  font-weight:800;color:rgba(20,48,61,.62);font-variant-numeric:tabular-nums}
.val .reset{border:0;background:none;padding:2px 4px;font-size:11.5px;font-weight:800;color:var(--leaf);cursor:pointer}
.rowlab{margin:5px 2px 0;font-size:10.5px;font-weight:800;color:rgba(20,48,61,.5)}
input[type=range]{width:100%;margin:1px 0 0;accent-color:var(--leaf);height:26px}
.out{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,246,.97);border-top:1px solid var(--line);
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(15,59,58,.10)}
.out .row{display:flex;gap:7px;align-items:center;max-width:1180px;margin:0 auto}
.out textarea{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.4;background:#fff;color:var(--ink);resize:none}
.msg{margin:6px auto 0;max-width:1180px;font-size:11.5px;font-weight:800;color:var(--leaf);min-height:15px}
.err{color:#B4341F}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>사진첩 앵글 점검</h1>
  <p class="lede">앱의 포토카드와 <b>같은 비율·같은 자르기</b>로 26명을 한 번에 보여줍니다. <b>사진 전체 보기</b>를 켜면 원본 위에 카드가 실제로 보여줄 구간이 노란 틀로 표시됩니다. 얼굴이 틀 안에 오도록 슬라이더를 맞춘 뒤, 아래 <b>값 복사</b>를 눌러 그대로 보내주세요.</p>

  <div class="bar">
    <button class="btn" type="button" id="toggleAll">사진 전체 보기</button>
    <button class="btn" type="button" id="toggleGuide">가운데 선</button>
    <button class="btn" type="button" id="onlyDirty">바꾼 것만 보기</button>
    <button class="btn go" type="button" id="copy">값 복사</button>
  </div>
  <p class="note" id="note">불러오는 중…</p>
  <div class="grid" id="grid"></div>
</div>

<div class="out">
  <div class="row">
    <textarea id="outText" readonly spellcheck="false" aria-label="바뀐 값"></textarea>
    <button class="btn go" type="button" id="copy2">복사</button>
  </div>
  <p class="msg" id="msg"></p>
</div>

<script src="../config.js"></script>
<script>
(function(){
'use strict';
/* ---- PRIVATE BETA access control (do not remove) ---- */
const BETA_KEY='V8f2Qm7L4xP9cN6w';
if(new URLSearchParams(location.search).get('key')!==BETA_KEY){document.body.innerHTML='<p style="padding:40px;text-align:center;font-weight:800">404</p>';return;}

const $=s=>document.querySelector(s);
const CFG=window.MUNIVERSE_CONFIG||{};
const SB_URL=CFG.supabaseUrl||'',SB_KEY=CFG.supabaseAnonKey||'',BUCKET='idolcamp-members';

/* 앱과 똑같은 주소 규칙을 써야 여기서 본 그림이 실제 카드와 일치한다 */
const DPR=Math.min(window.devicePixelRatio||1,2.5);
const MEMBER_BOX=[Math.round(340*Math.min(DPR,2.5)),86];
const IMG_OPT=!(CFG.exitCeremony&&CFG.exitCeremony.optimizeImages===false);
function publicUrl(path){return SB_URL+'/storage/v1/object/public/'+BUCKET+'/'+String(path||'').replace(/^\/+/,'');}
function renderUrl(path){
  if(!IMG_OPT)return publicUrl(path);
  return SB_URL+'/storage/v1/render/image/public/'+BUCKET+'/'+String(path||'').replace(/^\/+/,'')
    +'?width='+MEMBER_BOX[0]+'&quality='+MEMBER_BOX[1]+'&resize=contain';
}

/* 지금 배포되어 있는 값. app.html 의 PHOTO_FOCUS 와 같은 내용이다. */
const DEFAULT={x:0.5,y:0.26};
const LIVE={
  ahof_jl:{x:0.80,y:0.24},
  idntt_park_nuri:{x:0.80,y:0.24}
};
function liveOf(id){
  const f=LIVE[id];
  return {x:f&&f.x!=null?f.x:DEFAULT.x, y:f&&f.y!=null?f.y:DEFAULT.y};
}

const state=new Map();   /* id -> {x,y} 현재 슬라이더 값 */
let members=[];

function fmt(n){return Number(n).toFixed(2);}
function isDirty(id){
  const a=state.get(id),b=liveOf(id);
  return Math.abs(a.x-b.x)>0.001||Math.abs(a.y-b.y)>0.001;
}

function paintOut(){
  const rows=members.filter(m=>isDirty(m.id));
  const lines=rows.map(m=>{
    const v=state.get(m.id);
    const same=Math.abs(v.y-DEFAULT.y)<0.001;
    const body=same?'{x:'+fmt(v.x)+'}':'{x:'+fmt(v.x)+',y:'+fmt(v.y)+'}';
    return '  '+m.id+':'+body+',   /* '+(m.member_ko||m.member_en||'')+' */';
  });
  $('#outText').value=lines.length?lines.join('\n'):'바뀐 값이 없습니다.';
  $('#msg').textContent=lines.length?lines.length+'명 변경됨':'';
  $('#msg').classList.remove('err');
}

function makeCard(m){
  const v=state.get(m.id);
  const item=document.createElement('div');
  item.className='item';
  item.dataset.id=m.id;
  item.innerHTML=
    '<div class="shot"><img class="crop" alt=""><span class="guide"></span></div>'+
    '<div class="full"><img class="whole" alt=""><span class="win"></span><span class="dim"></span></div>'+
    '<p class="who"></p>'+
    '<div class="val"><span class="num"></span><button class="reset" type="button">기본값</button></div>'+
    '<p class="rowlab">좌우 (X)</p><input type="range" class="rx" min="0" max="1" step="0.01">'+
    '<p class="rowlab">위아래 (Y)</p><input type="range" class="ry" min="0" max="1" step="0.01">';

  const img=item.querySelector('.crop'),whole=item.querySelector('.whole'),
        win=item.querySelector('.win'),dim=item.querySelector('.dim'),who=item.querySelector('.who'),
        num=item.querySelector('.num'),rx=item.querySelector('.rx'),ry=item.querySelector('.ry');

  who.innerHTML='';
  who.appendChild(document.createTextNode(m.member_ko||m.member_en||m.id));
  const em=document.createElement('em');
  em.textContent=m.member_en||'';
  who.appendChild(em);

  img.alt=m.member_ko||m.member_en||'';
  /* 변환본이 막혀 있으면 원본으로 한 번 더 시도한다 */
  img.onerror=()=>{ if(img.src!==publicUrl(m.photo_path)){img.onerror=null;img.src=publicUrl(m.photo_path);} };
  img.onload=()=>{measure();apply();};
  img.src=renderUrl(m.photo_path);
  whole.src=img.src;

  /* 카드가 보여주는 폭은 원본 가로의 일부일 뿐이다.
     그 비율을 재 두어야 원본 위에 창을 정확히 그릴 수 있다. */
  const CARD=55/86;
  let seen=1;
  function measure(){
    const w=img.naturalWidth,h=img.naturalHeight;
    if(!w||!h)return;
    const ratio=w/h;
    seen=ratio>CARD?CARD/ratio:1;            /* 가로로 보이는 비율 (0~1) */
    dim.textContent=w+'×'+h+' · 가로 '+Math.round(seen*100)+'%만 보임';
  }

  function apply(){
    const s=state.get(m.id);
    img.style.objectPosition=(s.x*100).toFixed(1)+'% '+(s.y*100).toFixed(1)+'%';
    num.textContent='X '+fmt(s.x)+' · Y '+fmt(s.y);
    win.style.width=(seen*100).toFixed(2)+'%';
    win.style.left=(s.x*(1-seen)*100).toFixed(2)+'%';
    item.classList.toggle('dirty',isDirty(m.id));
    paintOut();
  }
  rx.value=v.x; ry.value=v.y;
  rx.addEventListener('input',()=>{state.get(m.id).x=Number(rx.value);apply();});
  ry.addEventListener('input',()=>{state.get(m.id).y=Number(ry.value);apply();});
  item.querySelector('.reset').addEventListener('click',()=>{
    const b=liveOf(m.id);
    state.set(m.id,{x:b.x,y:b.y});
    rx.value=b.x; ry.value=b.y; apply();
  });
  apply();
  return item;
}

async function boot(){
  if(!SB_URL||!SB_KEY){$('#note').textContent='설정을 읽지 못했습니다.';$('#note').classList.add('err');return;}
  try{
    const r=await fetch(SB_URL+'/rest/v1/camp_member_photos?select=id,member_ko,member_en,photo_path,sort_order&active=eq.true&is_group=eq.false&order=sort_order.asc',
      {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(!r.ok)throw new Error('members '+r.status);
    members=await r.json();
  }catch(e){
    $('#note').textContent='사진 목록을 불러오지 못했습니다: '+e.message;
    $('#note').classList.add('err');
    return;
  }
  members.forEach(m=>{const b=liveOf(m.id);state.set(m.id,{x:b.x,y:b.y});});
  const grid=$('#grid');
  const frag=document.createDocumentFragment();
  members.forEach(m=>frag.appendChild(makeCard(m)));
  grid.appendChild(frag);
  $('#note').textContent=members.length+'명. 초록 테두리가 생긴 카드만 값이 바뀐 것입니다.';
  paintOut();
}

$('#toggleAll').addEventListener('click',e=>{
  const on=document.body.classList.toggle('showAll');
  e.currentTarget.classList.toggle('on',on);
  e.currentTarget.textContent=on?'원본 감추기':'사진 전체 보기';
});
$('#toggleGuide').addEventListener('click',e=>{
  e.currentTarget.classList.toggle('on',document.body.classList.toggle('guides'));
});
$('#onlyDirty').addEventListener('click',e=>{
  const on=e.currentTarget.classList.toggle('on');
  document.querySelectorAll('.item').forEach(it=>{
    it.style.display=(!on||it.classList.contains('dirty'))?'':'none';
  });
});

async function copyOut(){
  const t=$('#outText'),msg=$('#msg');
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t.value);}
    else{t.removeAttribute('readonly');t.select();document.execCommand('copy');t.setAttribute('readonly','');}
    msg.textContent='복사했습니다. 그대로 붙여넣어 보내주세요.';msg.classList.remove('err');
  }catch(e){
    t.removeAttribute('readonly');t.select();t.setAttribute('readonly','');
    msg.textContent='복사가 막혔습니다. 위 칸을 길게 눌러 직접 복사해 주세요.';msg.classList.add('err');
  }
}
$('#copy').addEventListener('click',copyOut);
$('#copy2').addEventListener('click',copyOut);

boot();
})();
</script>
</body>
</html>
