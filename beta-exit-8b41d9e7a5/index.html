<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>아이돌 수련회 1기 퇴소식 · PRIVATE BETA</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9dfc9;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}
#betaFrame{display:block;width:100%;height:100dvh;border:0;background:#e9dfc9}
</style>
</head>
<body>
<iframe id="betaFrame" src="./app.html?key=V8f2Qm7L4xP9cN6w&direct=design-v14" title="아이돌 수련회 1기 퇴소식 프라이빗 베타" referrerpolicy="same-origin"></iframe>
<script>
(function(){
  'use strict';
  var frame=document.getElementById('betaFrame');
  function enhance(){
    try{
      var doc=frame.contentDocument;
      if(!doc||!doc.head)return;
      function addJs(id,src){if(doc.getElementById(id))return;var s=doc.createElement('script');s.id=id;s.src=src;doc.body.appendChild(s);}
      /* the app itself now carries the night banner and the certificate design,
         so the beta only keeps the wording pass and the sharp group photo. */
      addJs('beta-terminology','./terminology-v5.js?v=20260812-design-v14');
      addJs('beta-perfect-hq','./perfect-hq.js?v=20260812-design-v14');
      if(!doc.querySelector('base[data-beta-target]')){var b=doc.createElement('base');b.dataset.betaTarget='1';b.target='_top';doc.head.appendChild(b);}
    }catch(e){console.error('[private beta] enhancement failed',e);}
  }
  frame.addEventListener('load',enhance);
  setTimeout(enhance,500);
  setTimeout(enhance,1800);
})();
</script>
</body>
</html>
