<!DOCTYPE html>

<head>

<title>아이돌 수련회 퇴소식 · PRIVATE BETA</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9dfc9;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}
#betaFrame{display:block;width:100%;height:100dvh;border:0;background:#e9dfc9}
</style>
</head>
<body>
<iframe id="betaFrame" src="./app.html?key=V8f2Qm7L4xP9cN6w&direct=retina-v11" title="아이돌 수련회 퇴소식 프라이빗 베타" referrerpolicy="same-origin"></iframe>
<script>
(function(){
  'use strict';
  var frame=document.getElementById('betaFrame');
  function enhance(){
    try{
      var doc=frame.contentDocument;
      if(!doc||!doc.head)return;
      doc.documentElement.classList.add('exit-mockup-v2');
      function addCss(id,href){if(doc.getElementById(id))return;var l=doc.createElement('link');l.id=id;l.rel='stylesheet';l.href=href;doc.head.appendChild(l);}
      function addJs(id,src){if(doc.getElementById(id))return;var s=doc.createElement('script');s.id=id;s.src=src;doc.body.appendChild(s);}
      addCss('beta-base-theme','./mockup-v2.css?v=20260812-retina-v11');
      addCss('beta-approved-theme','./mockup-v3.css?v=20260812-retina-v11');
      addCss('beta-hero-theme','./hero-approved.css?v=20260812-retina-v11');
      addJs('beta-hq-hero','./hq-hero-loader.js?v=20260812-retina-v11');
      addJs('beta-cert-hidpi','./certificate-hidpi-v5.js?v=20260812-retina-v11');
      addJs('beta-terminology','./terminology-v5.js?v=20260812-retina-v11');
      addJs('beta-v3','./beta-v3.js?v=20260812-retina-v11');
      addJs('beta-perfect-hq','./perfect-hq.js?v=20260812-retina-v11');
      if(!doc.querySelector('base[data-beta-target]')){var b=doc.createElement('base');b.dataset.betaTarget='1';b.target='_top';doc.head.appendChild(b);}
    }catch(e){console.error('[private beta] enhancement failed',e);}
  }
  frame.addEventListener('load',enhance);
  setTimeout(enhance,500);
  setTimeout(enhance,1800);
})();
</script>
</body>
</html>
